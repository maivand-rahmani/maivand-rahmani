      <text x="798" y="113" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">01</text>
      <text x="826" y="113" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"><tspan fill="#7C3AED">const</tspan><tspan> idea = </tspan><tspan fill="#0891B2">build</tspan><tspan>(</tspan><tspan fill="#16A34A">"something"</tspan><tspan>)</tspan></text>
